<html>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { font-family: 'Poppins', sans-serif; }
</style>
<div style="background: #ffffff; border-radius: 12px; padding: 20px 10px; overflow-x: auto;">
<svg width="100%" viewBox="0 0 1620 540" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ===== OUTER WRAPPER ===== -->
<rect x="10" y="10" width="1600" height="440" rx="14" fill="none" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="640" y="2" width="240" height="24" rx="6" fill="#ffffff"/>
<text x="760" y="18" text-anchor="middle" font-family="Poppins" font-size="13px" font-weight="600" fill="#534AB7">Jira Ticket Assistant *</text>

<!-- ===== PHASE 1: GATHER ===== -->
<text x="130" y="52" text-anchor="middle" font-family="Poppins" font-size="11px" font-weight="500" letter-spacing="0.08em" fill="#888780">PHASE 1 · GATHER</text>

<!-- User input (parallelogram) -->
<g class="node" onclick="sendPrompt('How does the agent handle user input?')">
  <polygon points="50,80 220,80 200,140 30,140" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="125" y="104" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="13px" font-weight="500" fill="#0C447C">User input</text>
  <text x="125" y="122" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="11px" fill="#185FA5">Requirements</text>
</g>
<line x1="220" y1="110" x2="260" y2="110" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<!-- save_input_artifact -->
<g class="node" onclick="sendPrompt('What does save_input_artifact do?')">
  <rect x="260" y="86" width="170" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="345" y="110" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="13px" font-weight="500" fill="#085041">save_input_artifact</text>
</g>
<line x1="430" y1="110" x2="470" y2="110" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<!-- Diamond: Info complete? -->
<g class="node" onclick="sendPrompt('What info does the agent check for completeness?')">
  <polygon points="540,60 610,110 540,160 470,110" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="540" y="106" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="12px" font-weight="500" fill="#633806">Info</text>
  <text x="540" y="120" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="12px" font-weight="500" fill="#633806">complete?</text>
</g>

<!-- No — ask questions, loop back -->
<line x1="540" y1="160" x2="540" y2="200" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="552" y="184" font-family="Poppins" font-size="11px" fill="#5F5E5A">No</text>
<g class="node" onclick="sendPrompt('What clarifying questions does the agent ask?')">
  <rect x="480" y="200" width="120" height="36" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="540" y="218" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="11px" fill="#712B13">Ask ≤3 questions</text>
</g>
<path d="M480 218 L125 218 L125 140" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<!-- Yes -->
<line x1="610" y1="110" x2="670" y2="110" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="636" y="102" font-family="Poppins" font-size="11px" fill="#5F5E5A">Yes</text>

<!-- ===== PHASE 2: DRAFT ===== -->
<text x="830" y="52" text-anchor="middle" font-family="Poppins" font-size="11px" font-weight="500" letter-spacing="0.08em" fill="#888780">PHASE 2 · DRAFT</text>

<!-- Loop container -->
<rect x="670" y="64" width="320" height="184" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="6 4"/>
<text x="830" y="82" text-anchor="middle" font-family="Poppins" font-size="10px" fill="#B4B2A9">TicketCreationReviewLoop · max 2 iterations</text>

<!-- TicketCreator -->
<g class="node" onclick="sendPrompt('How does the TicketCreator sub-agent work?')">
  <rect x="700" y="96" width="260" height="44" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="830" y="112" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="13px" font-weight="500" fill="#3C3489">TicketCreator</text>

</g>
<line x1="830" y1="140" x2="830" y2="160" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<g class="node" onclick="sendPrompt('How does the TicketRefiner sub-agent review tickets?')">
  <rect x="700" y="160" width="260" height="44" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="830" y="176" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="13px" font-weight="500" fill="#3C3489">TicketRefiner</text>
  <text x="830" y="192" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="11px" fill="#534AB7">Review quality</text>
</g>

<!-- Refiner loop-back -->
<path d="M960 182 L975 182 L975 118 L960 118" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="984" y="154" font-family="Poppins" font-size="10px" fill="#B4B2A9">Refine</text>

<!-- exit_loop arrow out -->

<text x="846" y="224" font-family="Poppins" font-size="11px" fill="#5F5E5A">exit_loop</text>
<path d="M830 248 L830 280 L1070 280 L1070 140" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<!-- ===== PHASE 3: APPROVE ===== -->
<text x="1170" y="52" text-anchor="middle" font-family="Poppins" font-size="11px" font-weight="500" letter-spacing="0.08em" fill="#888780">PHASE 3 · APPROVE</text>

<!-- Display markdown (parallelogram) -->
<g class="node" onclick="sendPrompt('How is the ticket markdown displayed?')">

  <text x="1158" y="122" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="11px" fill="#185FA5">Markdown preview</text>

<g class="node" onclick="sendPrompt('How does the HITL confirm_ticket tool work?')">
  <rect x="1078" y="170" width="160" height="44" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="1091" y1="170" x2="1091" y2="214" stroke="#993556" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.35"/>

  <text x="1158" y="192" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="13px" font-weight="500" fill="#72243E">confirm_ticket</text>
</g>
<line x1="1158" y1="214" x2="1158" y2="256" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<!-- Diamond: User approves? -->
<g class="node" onclick="sendPrompt('What happens on approval or rejection?')">
  <polygon points="1158,256 1258,310 1158,364 1058,310" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="1158" y="302" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="12px" font-weight="500" fill="#633806">User</text>
  <text x="1158" y="318" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="12px" font-weight="500" fill="#633806">approves?</text>
</g>

<!-- Rejected — loop back -->
<line x1="1158" y1="364" x2="1158" y2="400" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="1172" y="386" font-family="Poppins" font-size="11px" fill="#5F5E5A">Rejected</text>
<g class="node">
  <rect x="1110" y="400" width="96" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="1158" y="415" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="11px" fill="#712B13">+ feedback</text>
</g>
<path d="M1110 415 L830 415 L830 248" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<!-- Approved -->
<line x1="1258" y1="310" x2="1340" y2="310" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="1296" y="298" font-family="Poppins" font-size="11px" fill="#5F5E5A" text-anchor="middle">Approved</text>

<!-- ===== PHASE 4: SAVE ===== -->
<text x="1460" y="52" text-anchor="middle" font-family="Poppins" font-size="11px" font-weight="500" letter-spacing="0.08em" fill="#888780">PHASE 4 · SAVE</text>

<!-- save_ticket_json -->
<g class="node" onclick="sendPrompt('How does save_ticket_json persist the ticket?')">
  <rect x="1340" y="286" width="160" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="1420" y="304" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="13px" font-weight="500" fill="#085041">save_ticket_json</text>
  <text x="1420" y="322" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="11px" fill="#0F6E56">Artifact + local file</text>
</g>
<line x1="1500" y1="310" x2="1530" y2="310" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

<!-- Confirm to user (parallelogram) -->
<g class="node" onclick="sendPrompt('What confirmation does the user receive?')">

  <text x="1558" y="306" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="11px" fill="#0C447C">Confirm</text>
  <text x="1558" y="320" text-anchor="middle" dominant-baseline="central" font-family="Poppins" font-size="11px" fill="#0C447C">to user</text>
</g>
